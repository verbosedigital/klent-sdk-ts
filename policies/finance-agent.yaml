policies:
  # Hard cap: nothing over $10k goes through. Period.
  - name: finance / hard-cap-10k-usd
    description: Refuse any USD transfer above 10,000.
    enforcement_mode: enforce
    effect: deny
    conditions:
      - field: tool
        operator: equals
        value: transfer_funds
      - field: input.currency
        operator: equals
        value: USD
      - field: input.amount
        operator: greater_than
        value: 10000

  # Mid-range transfers ($1k–10k) require human review. The action is parked
  # in pending_actions until a reviewer approves or rejects from the
  # dashboard. The SDK can wait synchronously (approval.wait) or return
  # pending and let the agent decide what to do.
  - name: finance / mid-range-needs-review
    description: Pause $1k–10k USD transfers for human approval.
    enforcement_mode: enforce
    effect: approve
    conditions:
      - field: tool
        operator: equals
        value: transfer_funds
      - field: input.amount
        operator: greater_than
        value: 1000

  # Always CC the audit address on outbound emails. Doesn't block the call —
  # just modifies it.
  - name: finance / cc-audit-on-email
    description: Modify outbound emails to CC the audit address.
    enforcement_mode: enforce
    effect: modify
    conditions:
      - field: tool
        operator: equals
        value: send_email
    modifications:
      - field: input.cc
        value: audit@klent.dev

  # Refuse any tool whose name contains "delete" or "drop" against finance
  # ledgers. Defensive — agents should never destroy ledger rows.
  - name: finance / no-ledger-mutation
    enforcement_mode: enforce
    effect: deny
    conditions:
      - field: tool
        operator: contains
        value: delete
      - field: input.resource
        operator: ends_with
        value: ledger

  # Cap each agent at 5 transfers per hour. Goes beyond conditions because
  # the engine alone can't see history — the API counts past
  # `action_executed` events for this (agent, tool) pair in the rolling
  # window. Triggered when count >= limit; effect runs (deny here).
  - name: finance / transfer-burst-cap
    description: Each agent can call transfer_funds at most 5 times per hour.
    enforcement_mode: enforce
    effect: deny
    conditions:
      - field: tool
        operator: equals
        value: transfer_funds
    rate_limit:
      scope: agent_tool
      limit: 5
      window_minutes: 60
