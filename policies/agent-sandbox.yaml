policies:
  # Default-deny posture: everything is blocked unless an explicit allow
  # earlier in the list whitelists it.

  # ---- Explicit allowlist ----

  - name: sandbox / allow read-only weather
    description: Read-only get_weather is fine.
    enforcement_mode: enforce
    effect: allow
    conditions:
      - field: tool
        operator: equals
        value: get_weather

  - name: sandbox / allow read-only knowledge lookup
    enforcement_mode: enforce
    effect: allow
    conditions:
      - field: tool
        operator: equals
        value: knowledge_lookup

  - name: sandbox / allow time
    enforcement_mode: enforce
    effect: allow
    conditions:
      - field: tool
        operator: equals
        value: get_time

  # ---- Agent-loop guard ----

  # Cut the cord if the agent retries the same tool 10 times in a row in a
  # single execution. Most "agent stuck in a loop" failures look like this:
  # one tool call, same args, repeated until tokens run out. A different
  # tool in between resets the streak — `loop_guard` is consecutive-only.
  - name: sandbox / cap knowledge_lookup retries
    description: Block a runaway agent that keeps re-querying knowledge_lookup.
    enforcement_mode: enforce
    effect: deny
    conditions:
      - field: tool
        operator: equals
        value: knowledge_lookup
    loop_guard:
      threshold: 10

  # ---- Shadow surveillance ----

  # Watch for outbound email attempts. Don't block (yet) — record so we can
  # decide if/when to add a real policy.
  - name: sandbox / shadow watch email
    description: Surface every email attempt without affecting the call.
    enforcement_mode: shadow
    effect: deny
    conditions:
      - field: tool
        operator: equals
        value: send_email

  # ---- Catch-all deny ----

  # Denies a wildcard that always matches. Put this last — earlier
  # allow-policies short-circuit before the engine reaches this row.
  - name: sandbox / deny everything else
    description: Default deny on every tool not explicitly allowed above.
    enforcement_mode: enforce
    effect: deny
    conditions:
      - field: tool
        operator: not_equals
        value: __never__
