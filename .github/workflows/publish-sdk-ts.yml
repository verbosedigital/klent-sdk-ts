name: Publish TypeScript SDK

on:
  push:
    tags:
      - 'sdk-ts-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # OIDC Trusted Publishing requires npm CLI ≥11.5.1 (GA July 2025). The
      # Node version pinned in .nvmrc (20.18.x) ships npm 10.x, so we upgrade
      # npm globally for this job. `--no-audit --no-fund` keeps the install
      # log clean.
      - name: Upgrade npm to OIDC-capable version
        run: npm install -g npm@latest --no-audit --no-fund

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build @klent/schema + @klent/sdk
        run: pnpm turbo run build --filter=@klent/schema --filter=@klent/sdk

      # Pre-release versions (e.g. 0.0.1-alpha.0, 0.1.0-rc.1) publish under
      # the `next` dist-tag so they don't become the default for
      # `npm install @klent/sdk`. Stable versions (0.0.1, 0.1.0) get `latest`.
      - name: Determine npm dist-tag
        id: dist_tag
        run: |
          VERSION="${GITHUB_REF_NAME#sdk-ts-v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "Publishing $VERSION as pre-release (dist-tag: next)"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Publishing $VERSION as stable (dist-tag: latest)"
          fi

      # We use `npm publish` (not `pnpm publish`) for the publishing step
      # because npm CLI has stable, first-party support for OIDC Trusted
      # Publishing; pnpm's OIDC support across the 9.x line was inconsistent.
      # `pnpm pack` builds the tarball respecting workspace `files`/`exports`,
      # then `npm publish` uploads it via OIDC. No NPM_TOKEN required —
      # npm reads the OIDC id-token directly from the GitHub Actions
      # environment thanks to `permissions: id-token: write`.
      #
      # `--provenance` is enabled now that this repo lives in the public
      # `verbosedigital/klent-sdk-ts`. npm attaches a signed attestation
      # tying each published tarball to the exact git commit + workflow
      # run that produced it. Users see a verified provenance badge on
      # npmjs.com. (This used to be disabled when the SDK lived inside
      # the private monorepo, because npm rejects provenance from
      # private repos.)
      - name: Publish @klent/schema
        working-directory: packages/schema
        run: |
          pnpm pack --pack-destination .
          npm publish *.tgz --access public --provenance --tag ${{ steps.dist_tag.outputs.tag }}

      - name: Publish @klent/sdk
        working-directory: packages/sdk-ts
        run: |
          pnpm pack --pack-destination .
          npm publish *.tgz --access public --provenance --tag ${{ steps.dist_tag.outputs.tag }}
